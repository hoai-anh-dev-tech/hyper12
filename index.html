<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Bà Làm Người Yêu Tui Nha! ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        
        /* ===== TRÁI TIM BAY ===== */
        .heart-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .falling-heart {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            opacity: 0.6;
            user-select: none;
        }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg) scale(1); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
        }
        
        /* ===== CONTAINER CHÍNH ===== */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 40px 40px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* ===== AVATAR ===== */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 18px;
            box-shadow: 0 10px 40px rgba(245, 87, 108, 0.4);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }
        
        .avatar::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
            animation: pulseGlow 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        
        /* ===== TIÊU ĐỀ ===== */
        h1 {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        
        .sub-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        
        /* ===== CÂU HỎI ===== */
        .question {
            color: rgba(255, 255, 255, 0.95);
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .question .highlight {
            color: #f5576c;
            font-weight: 700;
        }
        
        .emoji-big {
            font-size: 40px;
            display: block;
            margin: 5px 0 10px;
        }
        
        /* ===== NÚT ===== */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
            position: relative;
        }
        
        .btn {
            padding: 16px 45px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: inline-block;
            min-width: 140px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: inherit;
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }
        
        .btn:hover::before {
            opacity: 0.4;
        }
        
        .btn-yes {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.4);
        }
        
        .btn-yes:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 50px rgba(245, 87, 108, 0.6);
        }
        
        .btn-yes:active {
            transform: scale(0.95);
        }
        
        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }
        
        .btn-no:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }
        
        /* ===== COUNTER ===== */
        .counter {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 1px;
            min-height: 24px;
            transition: all 0.3s;
        }
        
        .counter.active {
            color: #f5576c;
            font-weight: 600;
        }
        
        /* ===== MODAL ===== */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-box {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 45px 35px 40px;
            border-radius: 40px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8);
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .modal-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 10px;
            animation: wiggle 1.5s ease-in-out infinite;
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .modal-title {
            color: #f5576c;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            line-height: 1.8;
        }
        
        .modal-text .highlight {
            color: #f5576c;
            font-weight: 700;
        }
        
        .modal-btn {
            margin-top: 25px;
            padding: 14px 50px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.4);
        }
        
        .modal-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(245, 87, 108, 0.6);
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container { padding: 30px 18px 25px; }
            h1 { font-size: 26px; }
            .question { font-size: 18px; }
            .btn { padding: 14px 30px; font-size: 16px; min-width: 110px; }
            .modal-box { padding: 30px 20px; }
            .modal-title { font-size: 24px; }
            .modal-text { font-size: 16px; }
            .avatar { width: 80px; height: 80px; font-size: 40px; }
        }
    </style>
</head>
<body>
    
    <!-- ===== TRÁI TIM BAY ===== -->
    <div class="heart-rain" id="heartRain"></div>
    
    <!-- ===== CONTAINER CHÍNH ===== -->
    <div class="container" id="mainContainer">
        
        <div class="avatar">💘</div>
        
        <h1>❤️ Bà Làm Người Yêu Tui Nha! ❤️</h1>
        <p class="sub-text">✨ Từ một thằng "mê công nghệ" nhưng mê bà hơn ✨</p>
        
        <div class="question">
            <span class="emoji-big">🥺</span>
            <span class="highlight">Bà</span> có chịu làm <span class="highlight">người yêu</span> tui không?
            <br><span style="font-size:16px; color:rgba(255,255,255,0.5);">(chọn đại đi, đừng ngại 😏)</span>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-yes" id="btnYes">💖 Đồng Ý</button>
            <button class="btn btn-no" id="btnNo">😅 Từ Chối</button>
        </div>
        
        <div class="counter" id="counter">💕 ...</div>
    </div>
    
    <!-- ===== MODAL ===== -->
    <div id="modal">
        <div class="modal-box">
            <span class="modal-emoji">💞</span>
            <div class="modal-title">Yêu Bà Quá Trời! ❤️</div>
            <div class="modal-text">
                Cảm ơn bà đã đồng ý! 🥰<br>
                Tui hứa sẽ luôn là <span class="highlight">"người đàn ông"</span><br>
                mà bà có thể <span class="highlight">tin tưởng</span> nhất!<br><br>
                <span style="font-size:24px;">💝💖💗</span>
            </div>
            <button class="modal-btn" onclick="closeModal()">💋 Cảm ơn Bà!</button>
        </div>
    </div>
    
    <script>
        // =========================================================
        // 1. TRÁI TIM BAY
        // =========================================================
        function createFallingHearts() {
            const container = document.getElementById('heartRain');
            const symbols = ['❤️', '💕', '💖', '💗', '💘', '💝', '💞'];
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.className = 'falling-heart';
                el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (16 + Math.random() * 28) + 'px';
                el.style.animationDuration = (5 + Math.random() * 12) + 's';
                el.style.animationDelay = (Math.random() * 18) + 's';
                container.appendChild(el);
            }
        }
        createFallingHearts();
        
        // =========================================================
        // 2. COUNTER TỪ CHỐI
        // =========================================================
        let noCount = 0;
        const counterEl = document.getElementById('counter');
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        
        const noMessages = [
            '😅 Thôi mà... đồng ý đi mà!',
            '🥺 Đừng từ chối tui mà...',
            '💔 Tui buồn lắm đó...',
            '😏 Bà biết tui không bỏ cuộc đâu!',
            '🔥 Càng từ chối tui càng thích!',
            '💘 Bà là định mệnh của tui!',
            '😭 Tui khóc đó... đồng ý đi!',
            '💪 Đánh đổi tất cả vì bà!',
            '🥰 Bà đẹp nhất quả đất!',
            '💖 Yêu bà quá trời!'
        ];
        
        btnNo.addEventListener('click', function(e) {
            noCount++;
            const msg = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
            counterEl.textContent = '💔 Đã từ chối ' + noCount + ' lần... ' + msg;
            counterEl.className = 'counter active';
            
            // Đổi text nút "Không"
            const noTexts = ['😅 Từ Chối', '😏 Suy Nghĩ Lại', '🥺 Đừng Mà', '💔 Tội Tui', '🔥 Không Thoát Đâu', '💘 Yêu Đi Mà'];
            this.textContent = noTexts[Math.min(noCount - 1, noTexts.length - 1)];
            
            // Đổi màu nút Yes cho hấp dẫn
            if (noCount >= 3) {
                btnYes.style.transform = 'scale(1.1)';
                btnYes.style.boxShadow = '0 0 60px rgba(245,87,108,0.8)';
                setTimeout(() => {
                    btnYes.style.transform = 'scale(1)';
                    btnYes.style.boxShadow = '0 8px 30px rgba(245,87,108,0.4)';
                }, 300);
            }
            
            // Nếu từ chối quá 10 lần -> "bà" tự động đồng ý 😏
            if (noCount >= 10) {
                counterEl.textContent = '💕 Bà chịu rồi đúng không? Tui biết mà! 😏';
                setTimeout(() => {
                    document.getElementById('btnYes').click();
                }, 500);
                return;
            }
            
            // Di chuyển nút "Từ Chối" sang chỗ khác
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            
            const maxX = window.innerWidth - 160;
            const maxY = window.innerHeight - 80;
            
            let newX = 20 + Math.random() * (maxX - 40);
            let newY = 20 + Math.random() * (maxY - 40);
            
            this.style.position = 'fixed';
            this.style.left = newX + 'px';
            this.style.top = newY + 'px';
            this.style.zIndex = '999';
            this.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            this.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 100);
        });
        
        // HOVER cũng chạy trốn (nhưng dịu hơn)
        btnNo.addEventListener('mouseenter', function() {
            if (noCount < 5) {
                const maxX = window.innerWidth - 160;
                const maxY = window.innerHeight - 80;
                const newX = 20 + Math.random() * (maxX - 40);
                const newY = 20 + Math.random() * (maxY - 40);
                
                this.style.position = 'fixed';
                this.style.left = newX + 'px';
                this.style.top = newY + 'px';
                this.style.zIndex = '999';
                this.style.transition = 'all 0.3s ease';
            }
        });
        
        // =========================================================
        // 3. NÚT "ĐỒNG Ý" - NỔ TIM + MODAL
        // =========================================================
        btnYes.addEventListener('click', function() {
            // Nổ tim
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    const symbols = ['❤️','💕','💖','💗','💘','💝','💞','💓'];
                    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    heart.style.position = 'fixed';
                    heart.style.left = (30 + Math.random() * 40) + '%';
                    heart.style.top = (30 + Math.random() * 40) + '%';
                    heart.style.fontSize = (30 + Math.random() * 60) + 'px';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '999';
                    heart.style.transition = 'all 2.5s ease-out';
                    heart.style.opacity = '1';
                    document.body.appendChild(heart);
                    
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 150 + Math.random() * 300;
                    const dx = Math.cos(angle) * dist;
                    const dy = Math.sin(angle) * dist - 100;
                    
                    setTimeout(() => {
                        heart.style.transform = `translate(${dx}px, ${dy}px) scale(${0.3 + Math.random() * 1.2}) rotate(${Math.random() * 720}deg)`;
                        heart.style.opacity = '0';
                    }, 50);
                    
                    setTimeout(() => heart.remove(), 2800);
                }, i * 40);
            }
            
            // Hiện modal
            setTimeout(() => {
                document.getElementById('modal').style.display = 'flex';
            }, 400);
        });
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            // Thêm tim bay tiếp
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.textContent = ['💕','💖','💗','💘'][Math.floor(Math.random()*4)];
                    heart.style.position = 'fixed';
                    heart.style.left = (10 + Math.random() * 80) + '%';
                    heart.style.top = (10 + Math.random() * 80) + '%';
                    heart.style.fontSize = (40 + Math.random() * 40) + 'px';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '999';
                    heart.style.transition = 'all 2s ease-out';
                    heart.style.opacity = '0';
                    document.body.appendChild(heart);
                    setTimeout(() => {
                        heart.style.transform = `translateY(-200px) scale(2)`;
                        heart.style.opacity = '1';
                    }, 50);
                    setTimeout(() => {
                        heart.style.transform = `translateY(-400px) scale(0.5)`;
                        heart.style.opacity = '0';
                    }, 800);
                    setTimeout(() => heart.remove(), 1200);
                }, i * 80);
            }
        }
        
        // =========================================================
        // 4. TỰ ĐỘNG THAY ĐỔI SUBTEXT
        // =========================================================
        const subTexts = [
            '✨ Từ một thằng "mê công nghệ" nhưng mê bà hơn ✨',
            '💕 Bà là "code" đẹp nhất cuộc đời tui',
            '📡 Tín hiệu từ trái tim tui gửi đến bà đây',
            '🔋 Bà là năng lượng sống của tui',
            '🌍 Cả thế giới chỉ có bà là đặc biệt'
        ];
        let subIdx = 0;
        const subEl = document.querySelector('.sub-text');
        setInterval(() => {
            subIdx = (subIdx + 1) % subTexts.length;
            subEl.textContent = subTexts[subIdx];
        }, 4000);
        
        console.log('💘 Bà làm người yêu tui nha! - 100% success rate! 🚀');
    </script>
</body>
</html>
