<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌕 Trung Thu Vui Vẻ 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .moon {
            width: 120px; height: 120px;
            background: radial-gradient(circle at 30% 30%, #fffbe6, #ffd966);
            border-radius: 50%; margin: 0 auto 20px;
            box-shadow: 0 0 60px rgba(255, 217, 102, 0.6);
            animation: glow 3s ease-in-out infinite alternate;
            position: relative;
            cursor: pointer;
        }

        .moon::after {
            content: "🌝"; position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 60px rgba(255, 217, 102, 0.6); }
            100% { box-shadow: 0 0 100px rgba(255, 217, 102, 1); }
        }

        h1 {
            color: #ffd966; font-size: 2rem; margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 217, 102, 0.5);
        }

        p {
            color: #e0e0e0; font-size: 1.1rem; line-height: 1.8;
            max-width: 500px; margin: 0 auto 20px;
        }

        .btn {
            display: inline-block; padding: 12px 35px;
            background: linear-gradient(135deg, #ffd966, #f0a500);
            color: #0d1b2a; text-decoration: none;
            border-radius: 30px; font-weight: bold; font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(240, 165, 0, 0.4);
            cursor: pointer; border: none;
            margin-top: 10px;
        }

        .btn:hover { transform: scale(1.05); }

        /* Màn hình jumpscare ma */
        .jumpscare {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .jumpscare img {
            width: 90%;
            max-width: 600px;
            animation: shake 0.04s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(15px, -10px) scale(1.05); }
            40% { transform: translate(-15px, 10px) scale(1.02); }
            60% { transform: translate(10px, 15px) scale(1.05); }
            80% { transform: translate(-10px, -15px) scale(1.02); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .jumpscare h2 {
            color: red;
            font-size: 3rem;
            margin-top: 20px;
            text-shadow: 0 0 30px red, 0 0 60px red;
            animation: shake 0.04s infinite;
        }

        .jumpscare .close-btn {
            margin-top: 40px;
            padding: 15px 50px;
            background: #ffd966;
            color: #0d1b2a;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .jumpscare .close-btn:hover {
            background: #f0a500;
            transform: scale(1.05);
        }

        .stars {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; overflow: hidden;
        }

        .star {
            position: absolute; background: white;
            border-radius: 50%; opacity: 0.6;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="moon" onclick="troll()"></div>
        <h1>🌕 Trung Thu Vui Vẻ 🌕</h1>
        <p>
            Chúc mừng Trung Thu!<br>
            Bấm vào mặt trăng để nhận quà nhé 🎁
        </p>
        <button class="btn" onclick="troll()">Nhận quà Trung Thu 🎁</button>
    </div>

    <!-- Jumpscare ma -->
    <div class="jumpscare" id="jumpscare">
        <img src="https://static.wixstatic.com/media/9d8ed5_bcb292de3ab6474ba4f90649f88235d8~mv2.jpg" alt="Ma">
        <h2>BỊ HÙ RỒI! 😂</h2>
        <button class="close-btn" onclick="closeTroll()">Thoát ra</button>
    </div>

    <script>
        // Tạo sao lấp lánh
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // Hàm troll (hù ma)
        function troll() {
            const jumpscare = document.getElementById('jumpscare');
            jumpscare.style.display = 'flex';

            // Phát tiếng hét (có thể bị chặn bởi trình duyệt nếu chưa tương tác)
            const audio = new Audio('https://www.myinstants.com/media/sounds/screaming-goat.mp3');
            audio.play().catch(e => console.log('Không phát được âm thanh:', e));
        }

        // Đóng jumpscare
        function closeTroll() {
            document.getElementById('jumpscare').style.display = 'none';
        }
    </script>

</body>
</html>
